<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f4f4;
      color: #333;
    }

    .container {
      padding: 100px 20px;
    }

    h1 {
      font-size: 80px;
      margin: 0;
    }

    p {
      font-size: 20px;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #333;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    a:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Sorry, that page could not be found.</p>
  </div>
</body>
</html>
